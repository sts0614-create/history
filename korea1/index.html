<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>국가의 형성과 발전 · 역사② Ⅰ단원 수업 자료</title>
<meta name="description" content="2022 개정 교육과정 중학교 역사② Ⅰ단원 국가의 형성과 발전 — 차시별 영상, 교사 발문, 생각 질문, 수업 게임과 한강 쟁탈전 시뮬레이션">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="ui.css">
<style>
.catalog-row{display:grid;grid-template-columns:minmax(230px,1fr) auto;gap:16px;align-items:center;padding:14px 26px;border-top:1px solid var(--line)}
.catalog-title{display:flex;align-items:flex-start;gap:12px;min-width:0}.catalog-no{color:var(--brand);font:800 21px/1.2 var(--f);font-variant-numeric:tabular-nums;flex:none}.catalog-name{min-width:0}.catalog-name b{display:block;font-size:15px;line-height:1.45}.catalog-name span{display:block;margin-top:3px;color:var(--muted);font-size:12px}
.catalog-links{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}.catalog-links a{display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--ink2);font-size:12px;font-weight:700;white-space:nowrap}.catalog-links a:hover{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-strong)}.catalog-links a:first-child{border-color:var(--brand);color:var(--brand-strong)}.catalog-links small{color:var(--muted);font-size:11px}
@media(max-width:760px){.catalog-row{grid-template-columns:1fr;gap:9px;padding:13px 16px}.catalog-links{justify-content:flex-start;padding-left:39px}}
</style>
</head>
<body>
<div id="gnb"></div>
<main class="page" id="main"></main>
<script src="data.js"></script><script src="slides.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const { esc, gnb } = K1, U = UNIT;
  document.getElementById("gnb").innerHTML = gnb([["역사② Ⅰ단원", ""]]);
  const nVid = LESSONS.reduce((s, l) => s + l.videos.length, 0);
  const done = K1.store.get("done", {});
  const row = l => {
    const activityHref = l.game.sim ? "sim.html" : `game.html?g=${encodeURIComponent(l.game.id)}`;
    const activityType = l.game.sim ? "시뮬레이션" : "게임";
    const status = done[l.n] ? '<span class="chip ok">수업함</span>' : "";
    return `<li class="catalog-row">
      <div class="catalog-title"><span class="catalog-no">${l.n}</span><span class="catalog-name"><b>${esc(l.title)} ${status}</b><span>${esc(l.eraLabel)} · ${l.std === "전체" ? "단원 정리" : esc(l.std)}</span></span></div>
      <div class="catalog-links">
        <a href="slides${l.n}.html">수업 슬라이드 <small>${(window.SLIDES || {})[l.n] || ""}장</small></a>
        <a href="lesson.html?n=${l.n}">차시 자료 <small>${l.videos.length}편 영상</small></a>
        <a href="${activityHref}">${activityType} <small>${esc(l.game.time)}</small></a>
      </div>
    </li>`;
  };
  document.getElementById("main").innerHTML = `
    <section class="hero">
      <div>
        <div class="kicker"><span class="chip brand">2022 개정 교육과정</span><span class="chip">중학교 ${U.book}</span></div>
        <h1><small>${U.book} ${U.no}단원</small>${esc(U.title)}</h1>
        <p class="lead">고조선의 성립부터 562년 대가야 멸망까지. 차시마다 <b>수업 슬라이드</b> 하나로 수업이 흘러갑니다 — 목표 → 영상으로 열기 → 개념·사료 → 게임 → 확인 문제 → 생각 질문 → 정리 → 나가기 전 한 문제.</p>
      </div>
      <div class="facts"><div><b class="num">${LESSONS.length}</b><span>차시</span></div><div><b class="num">${Object.values(window.SLIDES || {}).reduce((a, b) => a + b, 0)}</b><span>수업 슬라이드</span></div><div><b class="num">${nVid}</b><span>추천 영상</span></div><div><b class="num">${LESSONS.length}</b><span>게임·시뮬레이션</span></div></div>
    </section>

    <section class="card" style="margin-bottom:20px">
      <div class="sec" style="padding-bottom:6px">
        <div class="sec-h"><h2>차시별 자료</h2><span class="meta">슬라이드에는 영상 · 사료 · 발문 · 생각 열기 질문이 포함됩니다</span></div>
      </div>
      <ol class="lessons">${LESSONS.map(row).join("")}</ol>
    </section>

    <section class="card">
      <div class="sec">
        <div class="sec-h"><h2>성취기준</h2></div>
        <ul class="std">${U.standards.map(([c, t]) => `<li><code>${c}</code><span>${esc(t)}</span></li>`).join("")}</ul>
      </div>
      <div class="sec">
        <div class="sec-h"><h2>영상 표시 읽는 법</h2></div>
        <ul class="std">${Object.values(K1.BADGE).map(([t, c, d]) => `<li><span class="chip ${c}" style="justify-self:start">${t}</span><span>${d}</span></li>`).join("")}</ul>
      </div>
    </section>`;
  if (innerWidth < 880) document.querySelectorAll(".lg-only").forEach(e => e.hidden = true);
})();
</script>
</body>
</html>
